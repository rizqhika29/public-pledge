name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-contracts:
    name: Lint Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: genvm-lint check contracts/public_pledge.py

  test-direct:
    name: Direct Mode Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # gltest reads gltest.config.yaml as soon as it is on the plugin path, and
      # that config references ACCOUNT_PRIVATE_KEY for the on-chain network.
      # Direct tests never sign anything, so a throwaway placeholder is enough.
      - name: Run direct mode tests
        env:
          ACCOUNT_PRIVATE_KEY: "0x1111111111111111111111111111111111111111111111111111111111111111"
        run: pytest tests/direct/ -v


  frontend:
    name: Frontend (typecheck and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `npm ci` installs exactly what frontend/package-lock.json pins, and fails
      # loudly if package.json has drifted from it. lockfile.yml keeps them in sync.
      - run: npm ci
      # Build first: `next build` generates the route types that `tsc` reads.
      - run: npm run build
      - run: npm run typecheck

  frontend-e2e:
    name: Frontend (end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `npm ci` installs exactly what frontend/package-lock.json pins, and fails
      # loudly if package.json has drifted from it. lockfile.yml keeps them in sync.
      - run: npm ci
      # No wallet extension and no key: e2e/mock-wallet.ts installs a fake
      # EIP-6963 wallet, and the tests block the GenLayer RPC so they stay offline.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Playwright writes an ARIA snapshot of the page for every failure. Printing
      # it puts the real DOM in the job log instead of just a selector timeout.
      - name: Show the failure context
        if: failure()
        run: |
          for file in test-results/*/error-context.md; do
            [ -e "$file" ] || continue
            echo "===== $file ====="
            cat "$file"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
